    <rect x="12.2" y="12"   width="1.9" height="3.5" rx="0.6" fill="#6E9BFF" opacity="0.75"/>
    <rect x="15"   y="13.5" width="1.9" height="2"   rx="0.6" fill="#6E9BFF" opacity="0.5"/>
